 const cats=[...new Set(data.products.map(p=>p.category).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ar'));if(!cats.includes(ui.category))ui.category='all';

 `<section class="stats" aria-label="ملخص الكتالوج">${stat('إجمالي المنتجات',fmt(data.products.length),'كل اختياراتك في مكان واحد','box')}${stat('جاهز للتجربة',fmt(data.products.filter(p=>p.status==='test').length),'منتجات تم تحديدها للاختبار','checkcircle')}${stat('متوسط هامش الربح',mean===null?'—':fmt(mean,1)+'<span style="font-size:18px">%</span>',metrics.length?'متوسط المنتجات ذات الأسعار المكتملة':'أضف أسعارك لبدء الحساب','trend')}${stat('المواسم والأشهر',fmt(data.seasons.length),'نظّم كل فرصة في وقتها','calendar')}</section>`+
 `<div class="section-head"><div><h2>مكتبة المنتجات</h2><p>التفاصيل التي تحتاجها لاتخاذ القرار التالي.</p></div><button class="text-link" data-action="navigate" data-page="seasons">كل المواسم ${icon('left','sm')}</button></div>`+

function normalizeSearch(v){return String(v).toLowerCase().normalize('NFKC').replace(/[\u064b-\u065f\u0670\u0640]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي')}
function filteredProducts(){const q=normalizeSearch(ui.query.trim());return data.products.filter(p=>(ui.season==='all'||p.seasonIds.includes(ui.season))&&(ui.status==='all'||p.status===ui.status)&&(ui.category==='all'||p.category===ui.category)&&(!q||normalizeSearch([p.name,p.description,p.category,p.market,p.reason,...p.suppliers.map(s=>s.name),...p.seasonIds.map(seasonName)].join(' ')).includes(q))).sort((a,b)=>{const ea=economics(a),eb=economics(b);if(ui.sort==='name')return a.name.localeCompare(b.name,'ar');if(ui.sort==='price')return(a.salePrice??Infinity)-(b.salePrice??Infinity);if(ui.sort==='margin')return(eb.margin??-Infinity)-(ea.margin??-Infinity);if(ui.sort==='profit')return(eb.profit??-Infinity)-(ea.profit??-Infinity);return b.createdAt.localeCompare(a.createdAt)})}
function renderResults(){const root=$('#productResults');if(!root)return;const products=filteredProducts();if(!products.length){root.innerHTML=emptyMarkup(data.products.length?'لا توجد نتائج مطابقة':'أول اختيار لكوداك يبدأ هنا',data.products.length?'غيّر البحث أو الفلاتر لتظهر المنتجات المناسبة.':'أضف منتجك الأول، ثم أكمل الموردين والتكاليف والموسم.',data.products.length?'<button class="btn" data-action="reset-filters">إعادة ضبط الفلاتر</button>':'<button class="btn primary admin-only" data-action="add-product">'+icon('plus')+' إضافة أول منتج</button>');return}root.innerHTML=(ui.layout==='grid'?`<div class="products">${products.map(cardMarkup).join('')}</div>`:tableMarkup(products))+`<div class="list-count">عرض <span class="num">${products.length}</span> من <span class="num">${data.products.length}</span> منتج · جميع الحسابات حسب التكاليف المدخلة.</div>`}

 ['الحالة',p=>statusPill(p)],['المواسم',p=>esc(p.seasonIds.map(seasonName).join('، ')||'—')],['سعر الشراء',p=>money(p.costPrice,2)],['الشحن على الشركة',p=>money(p.shipping??0,2)],['الإعلان لكل طلب',p=>money(p.ads??0,2)],['الرسوم والضرائب',p=>money(p.fees??0,2)],['تكاليف أخرى',p=>money(p.other??0,2)],['إجمالي تكلفة الطلب',p=>money(economics(p).costs,2)],['سعر البيع المقترح',p=>money(p.salePrice,2)],['الربح المتوقع',p=>`<b class="${economics(p).profit<0?'negative':'positive'}">${money(economics(p).profit,2)}</b>`],['هامش الربح',p=>`<b class="num">${economics(p).complete?fmt(economics(p).margin,1)+'%':'—'}</b>`],['عدد الموردين',p=>fmt(p.suppliers.length)],['السوق المستهدف',p=>esc(p.market||'—')],['الجمهور',p=>esc(p.audience||'—')],['سبب الترشيح',p=>esc(p.reason||'—')]
 ].map(([label,render])=>`<tr><th>${label}</th>${products.map(p=>`<td>${render(p)}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="tiny muted" style="margin-top:13px">${products.some(p=>p.demo)?'تتضمن المقارنة نماذج بأسعار افتراضية. ':''}الربح قبل المصاريف الثابتة، وفق التكاليف التي أدخلتها.</p>`:emptyMarkup('أي المنتجات أقرب لقرارك؟','حدّد مربع المقارنة على بطاقات المنتجات، ثم افتح هذه الصفحة.','<button class="btn primary" data-action="navigate" data-page="catalog">اختيار منتجات '+icon('left')+'</button>','compare'))}
function guideMarkup(){return hero('كل اختياراتك، على رابط واحد.','إدارة المنتجات والمواسم وحفظ التعديلات للجميع.','','YOUR SHARED CATALOGUE')+`<div class="guide-grid"><section class="guide-card"><h3>${icon('edit')} أضف أو عدّل منتجًا</h3><ol><li>اضغط «تسجيل الدخول للتعديل» وأدخل بريد الحساب المصرح له. افتح الرابط الذي يصلك في البريد.</li><li>من إدارة المحتوى، أضف المنتج والصورة والتكاليف والموردين وروابطهم والفيديو.</li><li>حدّد موسمًا أو أكثر ثم احفظ. انتظر ظهور تأكيد نجاح الحفظ للجميع.</li><li>شارك رابط الموقع نفسه مع الإدارة والتسويق؛ لا حاجة إلى رفع الملفات من جديد.</li></ol></section><section class="guide-card"><h3>${icon('calendar')} المواسم والأشهر</h3><p>أنشئ بلاك فرايدي والكريسماس وديسمبر أو أي تقسيم تحتاجه. يمكن للمنتج الظهور في أكثر من موسم. عند حذف موسم، يمكنك الاحتفاظ بالمنتجات وإزالة ارتباطها فقط، أو اختيار حذف المنتجات المرتبطة.</p></section><section class="guide-card"><h3>${icon('trend')} حساب هامش الربح</h3><div class="formula">الربح المتوقع = البيع − (الشراء + الشحن + الإعلان + الرسوم والضرائب + تكاليف أخرى)<br>هامش الربح % = الربح المتوقع ÷ البيع × 100</div><p>الحساب قبل المصاريف الثابتة. الخانات الإضافية الفارغة = صفر. يظهر الهامش عند وجود سعر شراء وسعر بيع أكبر من صفر. العملة موحّدة؛ تغيير رمزها لا يحوّل الأسعار بسعر صرف.</p></section><section class="guide-card"><h3>${icon('download')} انقل بياناتك القديمة</h3><p>افتح الرابط في المتصفح الذي أضفت منه منتجاتك سابقًا، ثم سجّل الدخول. سيظهر تنبيه لنقل النسخة القديمة بعد مراجعتها. يمكنك تنزيلها أولًا. وإذا كانت معك نسخة JSON، استخدم «نسخ احتياطية» ثم «استيراد نسخة بيانات». الاستيراد يستبدل النسخة المشتركة بعد تأكيدك.</p></section><section class="guide-card"><h3>${icon('restore')} الحفظ والتحديثات</h3><p>التعديلات تُحفظ في الكتالوج المشترك، وتظهر للأجهزة الأخرى تلقائيًا، مع تحديث احتياطي كل 15 ثانية. إذا كان هناك نموذج مفتوح، يظهر التحديث بعد إغلاقه. عند انقطاع الاتصال يبقى التعديل متاحًا لإعادة المحاولة أو التنزيل.</p><p style="margin-top:12px">إذا حفظ شخص آخر قبلك، لن نستبدل نسخته تلقائيًا. نزّل تعديلاتك ثم حمّل النسخة الأحدث وراجع تغييراتك.</p></section><section class="guide-card"><h3>${icon('video')} الصور والفيديو والمشاركة</h3><p>ارفع صورة PNG أو JPG أو WebP أو GIF حتى 3 ميجابايت، أو فيديو MP4 أو WebM أو Ogg حتى 12 ميجابايت. يمكنك أيضًا استخدام روابط مباشرة، وتدعم التفاصيل YouTube وVimeo. الوسائط المرتبطة بالكتالوج متاحة للمشاهدة من الرابط.</p><p style="margin-top:12px">المشاهدة متاحة لمن لديه رابط الموقع، والتعديل للحسابات المصرح لها. نسخة JSON تحتوي على روابط الوسائط السحابية؛ احتفظ بالملفات الأصلية كنسخة احتياطية. المقارنة تدعم أربعة منتجات والطباعة إلى PDF متاحة من المتصفح.</p></section></div>`}
function headMarkup(title,subtitle=''){return `<header class="dialog-head"><div><h2 id="dialogTitle">${esc(title)}</h2>${subtitle?`<p>${esc(subtitle)}</p>`:''}</div><button type="button" class="icon-btn" data-action="close-dialog" aria-label="إغلاق">${icon('close')}</button></header>`}
function openDialog(html,drawer=false,small=false){const dialog=$('#mainDialog');if(dialog.open)dialog.close();dialog.className=drawer?'drawer':small?'small-dialog':'';dialog.innerHTML=html;formDirty=false;dialog.showModal();dialog.scrollTop=0}
function closeDialog(){if(formDirty){ask('تجاهل التعديلات غير المحفوظة؟','لديك تعديلات داخل هذه النافذة لم تحفظها بعد.','تجاهل وإغلاق',()=>{formDirty=false;$('#mainDialog').close()});return}$('#mainDialog').close()}
function videoMarkup(value){if(!value)return '<div class="note-box empty-note">لم يُضف فيديو بعد.</div>';const src=safeVideo(value);if(!src)return '<div class="note-box empty-note">رابط الفيديو غير صالح.</div>';let embedded='';if(!src.startsWith('data:')){const u=new URL(src),host=u.hostname.replace(/^www\./,'');let id='';if(host==='youtu.be')id=u.pathname.slice(1).split('/')[0];if(host==='youtube.com'||host==='m.youtube.com'||host==='youtube-nocookie.com')id=u.searchParams.get('v')||u.pathname.match(/^\/(?:embed|shorts)\/([^/?]+)/)?.[1]||'';if(/^[A-Za-z0-9_-]{11}$/.test(id))embedded=`<iframe title="فيديو المنتج" src="https://www.youtube-nocookie.com/embed/${id}" allow="fullscreen; picture-in-picture" allowfullscreen loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>`;if(host==='vimeo.com'||host==='player.vimeo.com'){const vid=u.pathname.match(/(?:^|\/)(\d+)(?:$|\/)/)?.[1];if(vid)embedded=`<iframe title="فيديو المنتج" src="https://player.vimeo.com/video/${vid}" allow="fullscreen; picture-in-picture" allowfullscreen loading="lazy"></iframe>`}}
 const direct=src.startsWith('data:')||/\.(mp4|webm|ogg)(?:\?|$)/i.test(src);return `<div class="video-box">${embedded|| (direct?`<video controls playsinline preload="metadata" src="${esc(src)}"></video>`:'')}${!src.startsWith('data:')?`<a class="btn small" style="margin-top:9px" href="${esc(src)}" target="_blank" rel="noopener noreferrer">${icon('external','sm')} فتح الفيديو في صفحة مستقلة</a>`:''}</div>`}
function showDetail(id){const p=data.products.find(p=>p.id===id);if(!p)return;const e=economics(p);const note=v=>`<div class="note-box ${v?'':'empty-note'}">${esc(v||'لم تُضف معلومات بعد.')}</div>`;openDialog(headMarkup('تفاصيل المنتج',p.demo?'نموذج توضيحي — الأسعار والمعلومات افتراضية':'آخر تعديل: '+dateLabel(p.updatedAt))+`<div class="dialog-body"><div class="detail-media" style="background:${artBg(p)}">${productImage(p)}</div><div class="detail-head"><div><h2>${esc(p.name)}</h2><div class="detail-sub">${esc(p.category||'بدون تصنيف')} ${p.market?' · '+esc(p.market):''}</div></div>${statusPill(p)}</div><p class="detail-desc">${esc(p.description||'لم يُضف وصف لهذا المنتج بعد.')}</p><div class="product-tags">${p.seasonIds.map(id=>`<span class="season-tag">${esc(seasonName(id))}</span>`).join('')}</div><div class="detail-kpis"><div class="detail-kpi"><small>سعر البيع المقترح</small><div>${money(p.salePrice,2)}</div></div><div class="detail-kpi"><small>الربح المتوقع / طلب</small><div class="${e.profit<0?'negative':'positive'}">${money(e.profit,2)}</div></div><div class="detail-kpi"><small>هامش الربح المتوقع</small><div class="num ${e.margin<0?'negative':'positive'}">${e.complete?fmt(e.margin,1)+'%':'—'}</div></div></div><section class="detail-section"><h3>تفاصيل التكلفة لكل طلب</h3>${[['سعر شراء المنتج',p.costPrice],['الشحن على الشركة',p.shipping??0],['الإعلان لكل طلب',p.ads??0],['الرسوم والضرائب',p.fees??0],['تكاليف أخرى',p.other??0]].map(([label,value])=>`<div class="cost-row"><span class="muted">${label}</span><span>${money(value,2)}</span></div>`).join('')}<div class="cost-row total"><span>إجمالي التكلفة المدخلة</span><span>${money(e.costs,2)}</span></div><p class="tiny muted">الربح قبل المصاريف الثابتة، بناءً على مدخلاتك. الخانات الإضافية الفارغة = صفر.</p></section><section class="detail-section"><h3>${icon('store')} الموردون <span class="num muted">${p.suppliers.length}</span></h3>${p.suppliers.length?p.suppliers.map(s=>`<div class="supplier-card"><div class="flex between wrap"><div><h4>${esc(s.name||'مورد بدون اسم')}</h4><p>${esc(s.leadTime?'مدة التوصيل: '+s.leadTime:'لم تُحدد مدة التوصيل')}</p></div><div>${s.price!==null?money(s.price,2):'<span class="tiny muted">السعر غير محدد</span>'}</div></div>${s.notes?`<p>${esc(s.notes)}</p>`:''}${s.url?`<a class="btn small" style="margin-top:11px" href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">المنتج لدى المورد ${icon('external','sm')}</a>`:'<p>لم يُضف رابط مورد فعلي.</p>'}</div>`).join(''):note('')}</section><section class="detail-section"><h3>${icon('video')} فيديو المنتج</h3>${videoMarkup(p.video)}</section><section class="detail-section"><h3>لماذا هذا المنتج؟</h3>${note(p.reason)}</section><section class="detail-section"><h3>الجمهور المستهدف</h3>${note(p.audience)}</section><section class="detail-section"><h3>ملاحظات الإدارة والتسويق</h3>${note(p.notes)}</section>${p.customFields.length?`<section class="detail-section"><h3>معلومات إضافية</h3>${p.customFields.map(f=>`<div style="margin-top:13px"><p class="tiny muted" style="margin-bottom:5px">${esc(f.name)}</p>${note(f.value)}</div>`).join('')}</section>`:''}</div><footer class="dialog-footer"><button class="btn primary admin-only" data-action="edit-product" data-id="${esc(p.id)}">${icon('edit')} تعديل المنتج</button><button class="btn" data-action="toggle-compare" data-id="${esc(p.id)}">${icon('compare')} ${selected.has(p.id)?'إزالة من المقارنة':'أضف للمقارنة'}</button><span class="spacer"></span><button class="icon-btn danger admin-only" aria-label="حذف المنتج" data-action="delete-product" data-id="${esc(p.id)}">${icon('trash')}</button></footer>`,true)}
const field=(label,name,value='',type='text',extra='')=>`<div class="field"><label for="f-${name}">${label}</label><input id="f-${name}" name="${name}" type="${type}" value="${esc(value??'')}" ${type==='number'?'min="0" max="1000000000" step="0.01" inputmode="decimal"':''} ${extra}></div>`;
const area=(label,name,value='',extra='')=>`<div class="field"><label for="f-${name}">${label}</label><textarea id="f-${name}" name="${name}" ${extra}>${esc(value)}</textarea></div>`;
const formFooter=label=>`<footer class="dialog-footer"><button class="btn primary" type="submit">${icon('check')} ${label}</button><button class="btn" type="button" data-action="close-dialog">إلغاء</button><span class="spacer"></span><span class="tiny muted">يحفظ للجميع على الرابط نفسه</span></footer>`;
function mediaEditor(kind,value){const image=kind==='image';return `<div class="field"><label>${image?'صورة المنتج':'فيديو المنتج'}</label><div class="upload-box"><div class="upload-preview" id="${kind}Preview">${image&&value?`<img src="${esc(value)}" alt="معاينة صورة المنتج">`:icon(image?'image':'video')}</div><div class="grow"><div class="upload-actions"><button type="button" class="btn small" data-action="pick-media" data-kind="${kind}">${icon('upload','sm')} رفع ${image?'صورة':'فيديو'}</button><button type="button" class="btn small ghost" data-action="remove-media" data-kind="${kind}">إزالة</button></div><p id="${kind}FileLabel">${value.startsWith('data:')?'ملف مضمن محفوظ مع المنتج':image?'PNG / JPG / WebP / GIF · حتى 3 MB':'MP4 / WebM / Ogg · حتى 12 MB'}</p></div></div><input type="file" id="${kind}File" data-media="${kind}" accept="${image?'image/png,image/jpeg,image/webp,image/gif':'video/mp4,video/webm,video/ogg'}" hidden><input id="${kind}URL" class="media-url" style="margin-top:8px" type="text" inputmode="url" placeholder="${image?'https://example.com/product.jpg':'رابط YouTube / Vimeo / فيديو مباشر'}" value="${value.startsWith('http')?esc(value):''}" aria-label="رابط ${image?'الصورة':'الفيديو'}"><small>${image?'الصورة المرفوعة تُضمّن داخل الملف، والرابط يجب أن يشير للصورة مباشرة.':'أضف فيديو من جهازك أو رابطًا. الملفات المرفوعة تنتقل مع النسخة المصدّرة.'}</small></div>`}
function supplierRow(s={}){const id=s.id||uid();return `<div class="supplier-editor" data-supplier-row="${esc(id)}"><div class="row-head"><span>${icon('store','sm')} بيانات المورد</span><button type="button" class="icon-btn danger" data-action="remove-supplier" aria-label="حذف هذا المورد">${icon('trash','sm')}</button></div><div class="form-grid"><div class="field"><label>اسم المورد<input data-supplier="name" maxlength="200" placeholder="اسم المتجر أو المورد" value="${esc(s.name)}"></label></div><div class="field"><label>سعره المرجعي (${esc(currencyNames[data.settings.currency])})<input data-supplier="price" type="number" min="0" max="1000000000" step="0.01" value="${esc(s.price??'')}" placeholder="اختياري"></label></div><div class="field span2"><label>رابط المنتج لدى المورد<input class="media-url" data-supplier="url" type="text" inputmode="url" value="${esc(s.url)}" placeholder="https://…"></label></div><div class="field"><label>مدة التوصيل<input data-supplier="leadTime" maxlength="200" value="${esc(s.leadTime)}" placeholder="مثال: 7–12 يومًا"></label></div><div class="field"><label>ملاحظات المورد<input data-supplier="notes" maxlength="1000" value="${esc(s.notes)}" placeholder="الشحن، الجودة، الحد الأدنى…"></label></div></div></div>`}
function customRow(f={}){return `<div class="custom-row"><input data-custom="name" maxlength="200" aria-label="اسم الحقل الإضافي" placeholder="اسم الحقل" value="${esc(f.name)}"><input data-custom="value" maxlength="5000" aria-label="قيمة الحقل الإضافي" placeholder="القيمة أو المعلومة" value="${esc(f.value)}"><button type="button" class="icon-btn danger" data-action="remove-custom" aria-label="حذف الحقل الإضافي">${icon('trash','sm')}</button></div>`}
function productEditor(id){const existing=data.products.find(p=>p.id===id);editorProduct=clone(existing||{id:uid(),name:'',description:'',category:'',market:'',audience:'',reason:'',notes:'',status:'candidate',seasonIds:ui.season!=='all'?[ui.season]:[],costPrice:null,salePrice:null,shipping:0,ads:0,fees:0,other:0,image:'',video:'',art:'box',demo:false,createdAt:now(),updatedAt:now(),suppliers:[],customFields:[]});const p=editorProduct;
 openDialog(headMarkup(existing?'تعديل المنتج':'اختيار جديد لكوداك','أكمل التفاصيل المتاحة الآن، ويمكنك العودة لتحديثها لاحقًا.')+`<form id="productForm"><div class="dialog-body"><div class="form-grid">${field('اسم المنتج *','name',p.name,'text','required maxlength="200" placeholder="أدخل اسم المنتج"')}${field('التصنيف','category',p.category,'text','maxlength="100" list="categoriesList" placeholder="مثال: المنزل والمكتب"')}<datalist id="categoriesList">${[...new Set(data.products.map(p=>p.category).filter(Boolean))].map(c=>`<option value="${esc(c)}">`).join('')}</datalist><div class="field"><label for="f-status">حالة المنتج</label><select id="f-status" name="status">${Object.entries(statuses).map(([k,v])=>`<option value="${k}" ${p.status===k?'selected':''}>${v.label}</option>`).join('')}</select></div>${field('السوق المستهدف','market',p.market,'text','maxlength="200" placeholder="مثال: السعودية"')}<div class="span2">${area('وصف المنتج','description',p.description,'maxlength="20000" placeholder="ما المنتج؟ وما المشكلة التي يعالجها؟"')}</div></div><h3 class="form-section">${icon('calendar')} المواسم والأشهر</h3><div class="check-grid">${data.seasons.length?data.seasons.map(s=>`<label class="check-option"><input type="checkbox" name="seasonIds" value="${esc(s.id)}" ${p.seasonIds.includes(s.id)?'checked':''}><span class="season-dot" style="--season-color:${s.color}"></span>${esc(s.name)}</label>`).join(''):'<span class="tiny muted">لا توجد مواسم بعد. يمكنك إضافتها من صفحة المواسم ثم تعديل المنتج.</span>'}</div><p class="tiny muted" style="margin-top:7px">يمكن ربط المنتج بأكثر من موسم، أو تركه دون موسم.</p><h3 class="form-section">${icon('image')} الصورة والفيديو</h3>${mediaEditor('image',p.image)}${mediaEditor('video',p.video)}<h3 class="form-section">${icon('trend')} التسعير والتكاليف لكل طلب <span class="tiny muted">${esc(currencyNames[data.settings.currency])}</span></h3><div class="form-grid">${field('سعر شراء المنتج','costPrice',p.costPrice,'number','placeholder="غير محدد"')}${field('سعر البيع المقترح','salePrice',p.salePrice,'number','placeholder="غير محدد"')}${field('الشحن على الشركة','shipping',p.shipping,'number')}${field('تكلفة الإعلان لكل طلب','ads',p.ads,'number')}${field('الرسوم والضرائب لكل طلب','fees',p.fees,'number')}${field('تكاليف أخرى لكل طلب','other',p.other,'number')}</div><div id="liveCalculator" class="live-calculator"></div><h3 class="form-section">${icon('store')} الموردون وروابط المنتج</h3><div id="supplierRows">${p.suppliers.map(supplierRow).join('')}</div><button type="button" class="btn small" data-action="add-supplier">${icon('plus','sm')} إضافة مورد</button><p class="tiny muted" style="margin-top:8px">سعر المورد للمقارنة؛ سعر الشراء المعتمد يُدخل في قسم التسعير أعلاه.</p><h3 class="form-section">${icon('spark')} ملاحظات القرار والتسويق</h3>${area('سبب ترشيح المنتج','reason',p.reason,'maxlength="20000" placeholder="المشكلة التي يحلها، ميزة العرض، الدليل على الطلب…"')}${area('الجمهور المستهدف','audience',p.audience,'maxlength="1000"')}${area('ملاحظات الإدارة والتسويق','notes',p.notes,'maxlength="20000"')}<h3 class="form-section">${icon('plus')} حقول إضافية</h3><div id="customRows">${p.customFields.map(customRow).join('')}</div><button type="button" class="btn small" data-action="add-custom">${icon('plus','sm')} إضافة حقل مخصص</button></div>${formFooter('حفظ المنتج')}</form>`,true);updateCalculator();}
function updateCalculator(){const form=$('#productForm');if(!form)return;const p={};for(const k of ['costPrice','salePrice','shipping','ads','fees','other'])p[k]=amount(form.elements[k].value);const e=economics(p);$('#liveCalculator').innerHTML=`<div><small>إجمالي التكلفة</small><b class="num">${fmt(e.costs,2)}</b></div><div><small>الربح المتوقع</small><b class="num ${e.profit<0?'negative':'positive'}">${fmt(e.profit,2)}</b></div><div><small>هامش الربح</small><b class="num ${e.margin<0?'negative':'positive'}">${e.complete?fmt(e.margin,1)+'%':'—'}</b></div><div class="calculator-note">حسب المدخلات، قبل المصاريف الثابتة. التكاليف الإضافية الفارغة تعامل كصفر. الأسعار بالـ ${esc(currencyNames[data.settings.currency])}.</div>`}

async function saveProduct(form){if(pendingMedia){toast('انتظر حتى يكتمل تحميل الملف.',true);return}try{const p=clone(editorProduct);for(const key of ['name','description','category','market','reason','audience','notes','status'])p[key]=form.elements[key].value.trim();if(!p.name)throw Error('أدخل اسم المنتج.');for(const k of ['costPrice','salePrice','shipping','ads','fees','other'])p[k]=amount(form.elements[k].value);p.seasonIds=$$('input[name=seasonIds]:checked',form).map(i=>i.value);p.suppliers=$$('[data-supplier-row]',form).map(row=>{const val=key=>$(`[data-supplier="${key}"]`,row).value.trim();const s={id:row.dataset.supplierRow,name:val('name'),url:readURL(val('url'),'المورد'),price:amount(val('price')),leadTime:val('leadTime'),notes:val('notes')};if(!s.name&&(s.url||s.price!==null||s.notes||s.leadTime))throw Error('أدخل اسمًا لكل مورد أضفته.');return s}).filter(s=>s.name);p.customFields=$$('.custom-row',form).map(row=>({name:$('[data-custom=name]',row).value.trim(),value:$('[data-custom=value]',row).value.trim()})).filter(f=>f.name||f.value);if(p.customFields.some(f=>!f.name))throw Error('أدخل اسمًا لكل حقل إضافي.');for(const kind of ['image','video']){const input=$('#'+kind+'URL');if(input.value.trim())p[kind]=readURL(input.value,kind==='image'?'الصورة':'الفيديو');}p.demo=false;p.updatedAt=now();const index=data.products.findIndex(v=>v.id===p.id);if(index<0)data.products.unshift(p);else data.products[index]=p;formDirty=false;$('#mainDialog').close();commit(index<0?'أُضيف المنتج إلى كتالوجك.':'حُفظت تفاصيل المنتج.')}catch(error){toast(error.message,true)}}

function download(content,name,type){const url=URL.createObjectURL(new Blob([content],{type}));const a=document.createElement('a');a.href=url;a.download=name;const links=$('#downloadLinks');if(links){const item=document.createElement('div');item.className='info-panel';item.style.marginTop='10px';item.innerHTML='<p>الملف جاهز. إذا لم يبدأ التنزيل، اضغط هنا:</p>';a.className='btn small';a.style.marginTop='8px';a.textContent='تحميل '+name;item.append(a);const details=document.createElement('details');details.style.marginTop='10px';details.innerHTML='<summary style="cursor:pointer;font-size:10px">خيار الحفظ اليدوي إذا منع المتصفح التنزيل</summary><p class="tiny">انسخ المحتوى التالي واحفظه بترميز UTF-8 وبنفس اسم الملف الموضح أعلاه.</p>';const source=document.createElement('textarea');source.readOnly=true;source.dir='ltr';source.style.cssText='font:10px monospace;height:150px;margin-top:8px';source.setAttribute('aria-label','محتوى ملف '+name);source.dataset.exportSource=name;source.textContent=content;details.append(source);item.append(details);links.prepend(item)}else document.body.append(a);a.click();if(!links)a.remove();setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},300000)}
function ask(title,message,label,action,extra=''){const dialog=$('#confirmDialog');if(dialog.open)dialog.close();dialog.innerHTML=`<header class="dialog-head"><h2 id="confirmTitle">${esc(title)}</h2><button class="icon-btn" data-confirm="cancel" aria-label="إغلاق">${icon('close')}</button></header><div class="dialog-body"><p class="confirm-text">${esc(message)}</p>${extra}</div><footer class="dialog-footer"><button class="btn danger" data-confirm="yes">${esc(label)}</button><button class="btn" data-confirm="cancel">إلغاء</button></footer>`;dialog._action=action;dialog.showModal();$('[data-confirm=cancel]',dialog).focus()}
function deleteProduct(id){const p=data.products.find(p=>p.id===id);if(!p)return;ask('حذف المنتج؟',`سيُحذف «${p.name}» مع صورته وفيديوه ومورديه وحقوله وكل ارتباطاته بالمواسم من الكتالوج المشترك. يظهر الحذف للجميع بعد اكتمال الحفظ.`,'حذف المنتج',()=>{data.products=data.products.filter(v=>v.id!==id);selected.delete(id);formDirty=false;if($('#mainDialog').open)$('#mainDialog').close();commit('حُذف المنتج وكل بياناته المرتبطة.');})}
function deleteSeason(id){const s=data.seasons.find(s=>s.id===id);if(!s)return;const n=data.products.filter(p=>p.seasonIds.includes(id)).length;ask('حذف الموسم؟',`سيُحذف موسم «${s.name}». يرتبط به ${n} منتج. افتراضيًا سنحتفظ بالمنتجات ونزيل ارتباطها بهذا الموسم فقط.`,'حذف الموسم',()=>{const remove=$('#deleteSeasonProducts')?.checked;if(remove){const ids=data.products.filter(p=>p.seasonIds.includes(id)).map(p=>p.id);data.products=data.products.filter(p=>!ids.includes(p.id));ids.forEach(id=>selected.delete(id));}else data.products.forEach(p=>p.seasonIds=p.seasonIds.filter(v=>v!==id));data.seasons=data.seasons.filter(v=>v.id!==id);if(ui.season===id)ui.season='all';commit(remove?'حُذف الموسم والمنتجات المرتبطة به.':'حُذف الموسم مع الاحتفاظ بمنتجاته.');},n?'<label class="check-option" style="margin-top:18px;color:var(--red)"><input id="deleteSeasonProducts" type="checkbox">حذف جميع المنتجات المرتبطة أيضًا، حتى لو ظهرت في مواسم أخرى.</label>':'')}
function changeCompare(id,checked){if(checked&&selected.size>=4&&!selected.has(id)){toast('يمكنك مقارنة أربعة منتجات كحد أقصى.',true);$$('[data-compare]').forEach(c=>c.checked=selected.has(c.dataset.compare));return false}if(checked)selected.add(id);else selected.delete(id);syncShell();$$('[data-compare]').forEach(c=>c.checked=selected.has(c.dataset.compare));if(ui.page==='compare')paint();return true}
async function loadMedia(input){const file=input.files?.[0];if(!file)return;const kind=input.dataset.media,isImage=kind!=='video',limit=isImage?3:12;const accepted=isImage?/^image\/(png|jpeg|webp|gif)$/:/^video\/(mp4|webm|ogg)$/;if(!accepted.test(file.type)){toast('نوع الملف غير مدعوم. اختر '+(isImage?'PNG أو JPG أو WebP أو GIF.':'MP4 أو WebM أو Ogg.'),true);input.value='';return}if(file.size>limit*1024*1024){toast(`الحد الأقصى ${limit} ميجابايت لكل ${isImage?'صورة':'فيديو'}. استخدم رابطًا للملفات الأكبر.`,true);input.value='';return}pendingMedia++;try{const value=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(reader.error);reader.readAsDataURL(file)});if(kind==='logo'){settingsLogo=value;$('#settingsLogoPreview').innerHTML=`<img src="${esc(value)}" alt="معاينة شعار الشركة">`}else if(editorProduct&&$('#productForm')){editorProduct[kind]=value;$('#'+kind+'URL').value='';$('#'+kind+'Preview').innerHTML=isImage?`<img src="${esc(value)}" alt="معاينة صورة المنتج">`:icon('checkcircle');$('#'+kind+'FileLabel').textContent=file.name+' · '+fmt(file.size/1024/1024,2)+' MB';}formDirty=true;toast('أُرفق الملف. احفظ التعديلات لإضافته إلى الكتالوج.')}catch{toast('تعذّر قراءة الملف. حاول اختيار ملف آخر.',true)}finally{pendingMedia--;input.value=''}}

$('#mainDialog').addEventListener('close',()=>{if($('#mainDialog').open)return;$$('video',$('#mainDialog')).forEach(v=>v.pause());$$('iframe',$('#mainDialog')).forEach(f=>f.removeAttribute('src'))});
$('#mainDialog').addEventListener('cancel',event=>{event.preventDefault();closeDialog()});
$('#mainDialog').addEventListener('click',event=>{if(event.target!==event.currentTarget)return;const rect=event.currentTarget.getBoundingClientRect();if(event.clientX<rect.left||event.clientX>rect.right||event.clientY<rect.top||event.clientY>rect.bottom)closeDialog()});
$('#confirmDialog').addEventListener('click',event=>{const btn=event.target.closest('[data-confirm]');if(!btn)return;const dlg=$('#confirmDialog');if(btn.dataset.confirm==='yes'){const action=dlg._action;action?.();dlg.close()}else dlg.close()});
$('#confirmDialog').addEventListener('close',()=>{$('#confirmDialog')._action=null});
document.addEventListener('error',event=>{const img=event.target;if(img.matches?.('img[data-product-image]')){img.hidden=true;const fallback=img.nextElementSibling;if(fallback)fallback.hidden=false;}},true);
window.addEventListener('beforeunload',event=>{if(formDirty||pendingMedia||cloud.saving||cloud.dirty){event.preventDefault();event.returnValue=''}});
void startCloud();

</script>
